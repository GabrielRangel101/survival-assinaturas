[project]
name = "sobrevivencia-assinaturas"
version = "1.0.0"
description = "Análise de sobrevivência aplicada à retenção de assinaturas (dados 100% sintéticos)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = ["docs: testes que exigem results.json e os documentos gerados (python run_all.py)"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
